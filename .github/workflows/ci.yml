name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Unit & component tests (Vitest) ──────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read Node version
        id: node
        run: |
          NODE=$(cat .nvmrc 2>/dev/null | tr -d '\n\r' || echo "22")
          echo "version=$NODE" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

  # ─── Build check ──────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Read Node version
        id: node
        run: |
          NODE=$(cat .nvmrc 2>/dev/null | tr -d '\n\r' || echo "22")
          echo "version=$NODE" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: pnpm build

  # ─── Playwright accessibility E2E (optional, runs on PRs only) ────────────
  accessibility-e2e:
    name: Accessibility E2E
    runs-on: ubuntu-latest
    needs: build
    # Only run on PRs — requires a built app served locally
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Read Node version
        id: node
        run: |
          NODE=$(cat .nvmrc 2>/dev/null | tr -d '\n\r' || echo "22")
          echo "version=$NODE" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Serve built app and run accessibility audit
        run: |
          pnpm exec vite preview --port 4173 &
          SERVER_PID=$!
          # Wait for server to be ready
          pnpm exec wait-on http://localhost:4173 --timeout 30000
          # Run only the accessibility spec
          pnpm exec playwright test playwright/accessibility.spec.ts \
            --reporter=list \
            --config=playwright.ci.config.ts
          kill $SERVER_PID
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

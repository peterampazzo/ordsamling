name: Deploy production

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event.release.tag_name }}
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Validate deployment configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          test -n "$AWS_ROLE_ARN" || { echo "Missing AWS_ROLE_ARN"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_PROJECT_NAME" || { echo "Missing CLOUDFLARE_PROJECT_NAME"; exit 1; }
          test -n "$GOOGLE_CLIENT_ID" || { echo "Missing GOOGLE_CLIENT_ID"; exit 1; }
          test -n "$GOOGLE_CLIENT_SECRET" || { echo "Missing GOOGLE_CLIENT_SECRET"; exit 1; }

      - name: Extract version from tag
        id: vars
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a semantic version beginning with v (for example, v1.2.3)." >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set build time
        id: set_build_time
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      - name: Write public/version.json
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          BUILD_TIME: ${{ steps.set_build_time.outputs.build_time }}
        run: |
          node --input-type=module -e \
            'import fs from "node:fs"; fs.writeFileSync("public/version.json", JSON.stringify({ version: process.env.VERSION, buildTime: process.env.BUILD_TIME }, null, 2) + "\n");'

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Validate release
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Build (pnpm)
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: pnpm run build

      - name: Configure AWS credentials for Terraform state
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Plan and apply release infrastructure
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          terraform init -input=false -lockfile=readonly
          terraform fmt -check -recursive
          terraform validate
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan

      - name: Deploy to Cloudflare Pages production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          RELEASE_SHA=$(git rev-parse HEAD)
          pnpm exec wrangler pages deploy dist \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --branch=main \
            --commit-hash="$RELEASE_SHA" \
            --commit-message="Release $RELEASE_TAG"

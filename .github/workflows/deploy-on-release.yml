name: Deploy release to Cloudflare Pages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Read Node version from .nvmrc
        id: read_node
        run: |
          if [ -f .nvmrc ]; then
            NODE_VERSION=$(cat .nvmrc | tr -d '\n' | tr -d '\r')
          else
            NODE_VERSION=22
          fi
          echo "node_version=$NODE_VERSION" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.read_node.outputs.node_version }}
          cache: pnpm

      - name: Extract version from tag
        id: vars
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version beginning with v (for example, v1.2.3)." >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set build time
        id: set_build_time
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      - name: Write public/version.json
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          BUILD_TIME: ${{ steps.set_build_time.outputs.build_time }}
        run: |
          node --input-type=module -e \
            'import fs from "node:fs"; fs.writeFileSync("public/version.json", JSON.stringify({ version: process.env.VERSION, buildTime: process.env.BUILD_TIME }, null, 2) + "\n");'

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Build (pnpm)
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: pnpm run build

      - name: Deploy to Cloudflare Pages with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
            --branch=${{ github.event.repository.default_branch }}
            --commit-hash=${{ github.sha }}
            --commit-message="Release ${{ github.event.release.tag_name }}"
